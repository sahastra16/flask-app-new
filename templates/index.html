<!-- templates/index.html -->
<!DOCTYPE html>
<html>
<head>
  <title>Flask App</title>
</head>
<body>
  <h1>Welcome to Your Flask App!</h1>
  <form action="/" method="post">
    <input type="text" name="message" placeholder="Enter message">
    <button type="submit">Submit</button>
  </form>
  {% if messages %}
    <h2>Messages:</h2>
    <ul>
    {% for msg in messages %}
      <li>{{ msg[1] }}</li>
    {% endfor %}
    </ul>
  {% endif %}
</body>
</html>
